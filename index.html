<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid</title>
<style>
:root{color-scheme:dark;--bg:#000;--ink:#fff;--sub:#9a9a9a;--line:#333;--acc:#fff;--on:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-weight:300;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:0 22px 64px}
.hero{padding:72px 0 48px}
.name{margin:0;font-size:clamp(56px,20vw,140px);line-height:1;font-weight:200;letter-spacing:.08em}
.name span{display:block}
.name span+span{color:transparent;-webkit-text-stroke:1px var(--acc)}
.tag{margin:24px 0 0;color:var(--sub);font-size:18px}
h2{font-size:20px;font-weight:300;letter-spacing:.08em;margin:56px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
h3{font-size:16px;font-weight:400;margin:24px 0 6px;color:var(--acc)}
p{margin:0;max-width:60ch}
.row{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row b{color:var(--acc);font-weight:400}
.who{display:flex;flex-wrap:wrap;gap:6px 22px}
.who span{white-space:nowrap}
small{color:var(--sub);font-size:13px;margin-left:4px}
.old{color:var(--sub)}
.old .who{gap:4px 16px}
.show{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.show time{min-width:104px;font-weight:400}
.show small{display:block;margin:0}
a.btn{display:inline-block;margin-top:8px;padding:12px 20px;background:var(--acc);color:var(--on);text-decoration:none;font-weight:400;border-radius:4px}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
footer{margin-top:56px;color:var(--sub);font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:1;display:flex;gap:4px;background:var(--bg);border-bottom:1px solid var(--line)}
nav a{padding:14px 16px;color:var(--sub);text-decoration:none;font-weight:400;letter-spacing:.12em;border-bottom:1px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--acc)}
nav a:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
[hidden]{display:none!important}
.seg{display:flex;gap:8px;margin-top:24px}
.seg a{padding:8px 14px;border:1px solid var(--line);border-radius:20px;color:var(--sub);text-decoration:none;font-weight:400;font-size:15px}
.seg a[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.seg a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bd{display:flex;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.bd time{min-width:56px;font-weight:400}
.del{margin-left:auto;background:none;border:1px solid var(--line);color:var(--sub);border-radius:4px;padding:2px 10px;font:inherit;font-size:13px;cursor:pointer}
.frm{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.frm input,.frm select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0}
.frm input[type=number]{width:72px}
.frm input:not([type]){flex:1;min-width:140px}
.add{font:inherit;font-weight:400;padding:8px 16px;border:0;border-radius:4px;background:var(--acc);color:var(--on);cursor:pointer}
.empty{color:var(--sub)}
.who .del{margin-left:6px;padding:0 8px;font-size:12px}
#intro{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .5s;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#intro .w{font-size:clamp(56px,17vw,130px);font-weight:200;letter-spacing:.3em;margin-right:-.3em;line-height:1;animation:lu 1.2s ease both}
#intro p{margin:20px auto 0;font-size:12px;letter-spacing:.2em;color:#9a9a9a;animation:lu 1.2s .6s ease both}
@keyframes lu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro .w,#intro p{animation:none}#intro{transition:none}}
</style>
</head>
